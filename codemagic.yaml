workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.alirezagoodarzi.voicegymplanner"
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: |
          export NEXT_PUBLIC_API_BASE_URL=https://voicegym-app.vercel.app
          npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          echo "Looking for Podfile..."
          find . -name "Podfile" -not -path "*/node_modules/*" || echo "No Podfile found"
          ls ios/
          ls ios/App/
      - name: Set up code signing
        script: |
          echo $CERTIFICATE | base64 --decode > /tmp/cert.cer
          echo $CERTIFICATE_PRIVATE_KEY | base64 --decode > /tmp/key.pem
          echo $PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision
          keychain initialize
          keychain add-certificates --certificate /tmp/cert.cer
          xcode-project use-profiles --provisioning-profile /tmp/profile.mobileprovision
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false