workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.alirezagoodarzi.voicegymplanner"
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: |
          export NEXT_PUBLIC_API_BASE_URL=https://voicegym-app.vercel.app
          npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          echo "Looking for Podfile..."
          find . -name "Podfile" -not -path "*/node_modules/*" || echo "No Podfile found"
          ls ios/
          ls ios/App/
      - name: Set up code signing
        script: |
          echo $CERTIFICATE | base64 --decode > /tmp/cert.cer
          echo $CERTIFICATE_PRIVATE_KEY | base64 --decode > /tmp/key.pem
          echo $PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision
          keychain initialize
          keychain add-certificates --certificate /tmp/cert.cer
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          xcode-project use-profiles
      - name: Create export options
        script: |
          cat > /tmp/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>SJLDSY6MKY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.alirezagoodarzi.voicegymplanner</key>
              <string>VoiceGymPlanner AppStore</string>
            </dict>
          </dict>
          </plist>
          EOF
      - name: Build iOS
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath /tmp/voicegym.xcarchive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="VoiceGymPlanner AppStore" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="SJLDSY6MKY" \
            archive
          xcodebuild -exportArchive \
            -archivePath /tmp/voicegym.xcarchive \
            -exportOptionsPlist /tmp/exportOptions.plist \
            -exportPath /tmp/voicegym-ipa
    artifacts:
      - /tmp/voicegym-ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false